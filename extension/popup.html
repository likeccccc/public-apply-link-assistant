<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开投递链接助手设置</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:370px;min-height:540px;background:#f5f8fc;color:#17243d;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{padding:16px}h1{margin:0 0 4px;font-size:18px}.hint{color:#667085;font-size:12px;margin:0 0 12px}.card{background:white;border:1px solid #dce5f2;border-radius:12px;padding:14px;margin-bottom:12px}h2{font-size:14px;margin:0 0 9px}label{display:block;font-weight:700;margin:10px 0 4px}input,select{width:100%;height:36px;border:1px solid #c9d5e8;border-radius:7px;background:white;padding:0 9px;color:#17243d;font:inherit}input:focus,select:focus{outline:2px solid #b7caff}.keyrow{display:flex;gap:7px}.keyrow input{min-width:0;flex:1}.keyrow button{flex:0 0 50px}button{border:0;border-radius:7px;padding:8px 10px;background:#e9effb;color:#2457d4;font:inherit;font-weight:700;cursor:pointer}.full{width:100%;margin-top:10px}.primary{background:#356df3;color:white}.small{font-size:11px;color:#667085;margin:8px 0 0}.status{min-height:18px;margin:9px 0 0;overflow-wrap:anywhere}.success{color:#067647}.error{color:#b42318}
</style></head><body><main><h1>公开投递链接助手</h1><p class="hint">这里设置接口；回到招聘页点绿色“查投递入口”浮卡搜索。</p>
<section class="card"><h2>模型接口</h2><label for="base">API Base URL</label><input id="base" type="url" spellcheck="false" autocomplete="url"><label for="model">模型名称</label><input id="model" spellcheck="false" autocomplete="off"><label for="key">API Key</label><div class="keyrow"><input id="key" type="password" spellcheck="false" autocomplete="off"><button id="toggle" type="button">显示</button></div><button id="authorize" class="full" type="button">检查并授权 API 域名</button><button id="testModel" class="full" type="button">测试当前模型能否联网搜索</button><p class="small">测试会向模型接口发送一次简短请求，可能消耗少量 Token。</p><p id="testStatus" class="status" role="status" aria-live="polite"></p></section>
<section class="card"><h2>搜索选项</h2><label for="scope">搜索范围</label><select id="scope"><option value="visible">当前屏幕，最多 12 家</option><option value="all">整页，最多 50 家</option></select><label for="placement">链接显示位置</label><select id="placement"><option value="company">公司名称列</option><option value="links">相关链接列</option></select><label for="browser">链接打开方式</label><select id="browser"><option value="chrome">当前浏览器（Chrome）</option><option value="edge">Microsoft Edge</option></select><p class="small">选 Edge 时，Chrome 可能首次询问是否打开外部应用。</p><button id="saveAll" class="full primary" type="button">保存全部设置</button><p id="saveStatus" class="status" role="status" aria-live="polite"></p><p class="small">各项输入会立即保存；弹窗关闭后再打开仍可继续填写。Key 只保存在当前浏览器配置文件中。</p></section>
</main><script src="popup.js"></script></body></html>
